name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Project
        run: |
          # Ensure Gradle wrapper uses a compatible version (8.14.1)
          sed -i 's|gradle-.*-all.zip|gradle-8.14.1-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          # Ensure required Android properties are set
          grep -q 'android.useAndroidX' android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
          grep -q 'android.enableJetifier' android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: |
          flutter analyze 2>&1 | tee analyze_output.log || {
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=FlutterAnalyze::$line"
            done < analyze_output.log
            exit 1
          }

      - name: Run Unit Tests
        run: |
          flutter test --reporter=expanded 2>&1 | tee test_output.log || {
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=FlutterTest::$line"
            done < test_output.log
            exit 1
          }

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation 2>&1 | tee build_output.log || {
            echo "::error title=BuildFailed::Release APK build failed. Showing last 60 lines:"
            tail -n 60 build_output.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=GradleBuild::$line"
            done
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduGovernance-ERP-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
